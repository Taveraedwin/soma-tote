<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#F7F7F5" />
      <stop offset="60%" stop-color="#EFEFEA" />
      <stop offset="100%" stop-color="#E4E4DC" />
    </radialGradient>

    <!-- Bag Body Gradient (Matte Technical Fabric) -->
    <linearGradient id="bodyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2D2E32" />
      <stop offset="45%" stop-color="#1F2023" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>

    <!-- Side Panel Shadow Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121315" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#222327" stop-opacity="0.2" />
    </linearGradient>

    <!-- Leather / Technical Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B3D43" />
      <stop offset="100%" stop-color="#1B1C1F" />
    </linearGradient>

    <!-- Subtle Metallic Accents -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="50%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#6B7280" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="softShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#0F1012" flood-opacity="0.22" />
    </filter>

    <filter id="subtleDetailShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Studio Background Canvas -->
  <rect width="800" height="800" rx="24" fill="url(#bgGlow)" />

  <!-- Subtle Studio Grid Accents -->
  <circle cx="400" cy="400" r="320" stroke="#000000" stroke-opacity="0.03" stroke-width="1.5" stroke-dasharray="4 6" fill="none" />
  <circle cx="400" cy="400" r="220" stroke="#000000" stroke-opacity="0.02" stroke-width="1" fill="none" />

  <!-- Bag Ground Shadow -->
  <ellipse cx="400" cy="690" rx="220" ry="24" fill="#000000" opacity="0.14" />
  <ellipse cx="400" cy="686" rx="160" ry="14" fill="#000000" opacity="0.18" />

  <!-- MAIN SOMA BAG GROUP -->
  <g filter="url(#softShadow)">

    <!-- Top Tote Handles (Extended upward for tote mode) -->
    <!-- Back Handle -->
    <path d="M330,280 C330,130 470,130 470,280" fill="none" stroke="#18191B" stroke-width="18" stroke-linecap="round" />
    <path d="M330,280 C330,130 470,130 470,280" fill="none" stroke="#2C2E33" stroke-width="14" stroke-linecap="round" opacity="0.6" />

    <!-- Backpack Straps (Visible subtle loops on sides indicating convertible nature) -->
    <path d="M250,330 C200,380 190,520 220,600" fill="none" stroke="#1A1B1D" stroke-width="20" stroke-linecap="round" />
    <path d="M550,330 C600,380 610,520 580,600" fill="none" stroke="#1A1B1D" stroke-width="20" stroke-linecap="round" />
    <!-- Strap adjustment anodized buckles -->
    <rect x="206" y="520" width="16" height="28" rx="4" fill="url(#metalGrad)" transform="rotate(12 214 534)" />
    <rect x="578" y="520" width="16" height="28" rx="4" fill="url(#metalGrad)" transform="rotate(-12 586 534)" />

    <!-- Main Bag Silhouette -->
    <!-- Base Body Shape: Sleek tapered tote backpack -->
    <path d="M 270,250 
             Q 280,240 310,240 
             L 490,240 
             Q 520,240 530,250 
             L 560,610 
             Q 565,650 530,655 
             L 270,655 
             Q 235,650 240,610 
             Z" 
          fill="url(#bodyGrad)" />

    <!-- 3D Contour Side Shading (Left & Right) -->
    <path d="M 270,250 L 315,250 L 305,655 L 270,655 Q 235,650 240,610 Z" fill="url(#panelGrad)" />
    <path d="M 530,250 L 485,250 L 495,655 L 530,655 Q 565,650 560,610 Z" fill="#0E0F11" opacity="0.4" />

    <!-- Top Closure Zipper & Flap Construction -->
    <rect x="295" y="235" width="210" height="12" rx="4" fill="#141517" />
    <line x1="305" y1="241" x2="495" y2="241" stroke="#374151" stroke-dasharray="2 3" stroke-width="2.5" />
    
    <!-- Anodized Minimalist Zipper Pull (Signature orange/amber tech cord) -->
    <circle cx="505" cy="241" r="5" fill="url(#metalGrad)" />
    <path d="M 505,241 L 525,255" stroke="#E11D48" stroke-width="3" stroke-linecap="round" />

    <!-- Front Quick-Access Vertical Pocket -->
    <g filter="url(#subtleDetailShadow)">
      <path d="M 440,310 L 440,510" stroke="#121315" stroke-width="3" stroke-linecap="round" />
      <line x1="440" y1="320" x2="440" y2="490" stroke="#33373E" stroke-dasharray="2 2" stroke-width="1.5" />
      <!-- Vertical Pocket Puller -->
      <circle cx="440" cy="380" r="4.5" fill="url(#metalGrad)" />
      <rect x="438" y="380" width="4" height="16" rx="2" fill="#E11D48" />
    </g>

    <!-- Magnetic Front Pocket Seam (Horizontal minimalist division) -->
    <path d="M 285,420 L 515,420" stroke="#18191B" stroke-width="2" />
    <path d="M 285,422 L 515,422" stroke="#35373C" stroke-width="1" opacity="0.4" />

    <!-- Front Carry Handle (In front of bag) -->
    <path d="M345,290 C345,160 455,160 455,290" fill="none" stroke="#1F2024" stroke-width="16" stroke-linecap="round" />
    <path d="M345,290 C345,160 455,160 455,290" fill="none" stroke="#3B3D43" stroke-width="12" stroke-linecap="round" opacity="0.4" />
    
    <!-- Handle Anchors with Reinforced Stitching -->
    <rect x="335" y="275" width="20" height="26" rx="3" fill="#151618" />
    <rect x="445" y="275" width="20" height="26" rx="3" fill="#151618" />
    <rect x="337" y="277" width="16" height="22" rx="2" fill="none" stroke="#4B5563" stroke-width="1" stroke-dasharray="1.5 2" />
    <rect x="447" y="277" width="16" height="22" rx="2" fill="none" stroke="#4B5563" stroke-width="1" stroke-dasharray="1.5 2" />

    <!-- Subtle Brand Wordmark on Bottom Center -->
    <text x="400" y="585" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="5" fill="#8B919D" opacity="0.85">SOMA</text>
    <text x="400" y="602" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="500" letter-spacing="2" fill="#525866">CONVERTIBLE TOTE · 20L</text>

    <!-- Bottom Reinforced Base Panel -->
    <path d="M 265,625 Q 400,645 535,625 L 530,650 Q 400,665 270,650 Z" fill="#111214" opacity="0.8" />
  </g>

  <!-- Interactive/Editorial Mode Badges Floating in Vector -->
  <g opacity="0.95">
    <!-- Mode 1 Tag -->
    <g transform="translate(110, 240)">
      <rect width="118" height="34" rx="17" fill="#FFFFFF" opacity="0.92" filter="url(#subtleDetailShadow)" />
      <circle cx="18" cy="17" r="4.5" fill="#E11D48" />
      <text x="32" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#18181B">Modo Tote</text>
    </g>

    <!-- Mode 2 Tag -->
    <g transform="translate(570, 360)">
      <rect width="132" height="34" rx="17" fill="#FFFFFF" opacity="0.92" filter="url(#subtleDetailShadow)" />
      <circle cx="18" cy="17" r="4.5" fill="#2563EB" />
      <text x="32" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#18181B">Modo Mochila</text>
    </g>

    <!-- Feature Tag -->
    <g transform="translate(100, 480)">
      <rect width="138" height="34" rx="17" fill="#FFFFFF" opacity="0.92" filter="url(#subtleDetailShadow)" />
      <circle cx="18" cy="17" r="4.5" fill="#059669" />
      <text x="32" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#18181B">Laptop 16" Ready</text>
    </g>
  </g>
</svg>
